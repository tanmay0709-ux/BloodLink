# ===== Server Configuration =====
server.port=${PORT:8080}

# ===== Load .env file (Spring Boot 2.4+ native support) =====
# 'optional:' means the app won't crash if .env is absent (e.g. in production
# where real env vars are set directly). The file must sit next to pom.xml.
spring.config.import=optional:file:.env[.properties]

# ===== MySQL DataSource Configuration =====
# Credentials are read from environment variables (see backend/.env).
# Set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD in your environment
# or in a .env file (never committed to version control).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bloodlink_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP defaults are fine; explicit for clarity)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT Configuration =====
# Secret is read from the JWT_SECRET environment variable.
# It must be a Base64-encoded string representing at least 32 random bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== CORS Configuration =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Logging =====
logging.level.com.bloodlink=DEBUG
logging.level.org.springframework.security=DEBUG
