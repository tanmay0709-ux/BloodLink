# ===== Server Configuration =====
server.port=8080

# ===== MySQL DataSource Configuration =====
# TODO: Change username and password before deploying to production
spring.datasource.url=jdbc:mysql://localhost:3306/bloodlink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT Configuration =====
# TODO: Replace with a secure random secret before deploying to production
app.jwt.secret=bloodlink_super_secret_jwt_key_please_change_in_production_min_256_bits
app.jwt.expiration=86400000

# ===== CORS Configuration =====
app.cors.allowed-origins=http://localhost:5173

# ===== Logging =====
logging.level.com.bloodlink=DEBUG
logging.level.org.springframework.security=DEBUG
